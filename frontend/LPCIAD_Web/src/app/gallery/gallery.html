<!-- WCAG 2.2.2 (Pausar, parar): foco em qualquer filho pausa o autoplay -->
<section class="gallery-section"
  (focusin)="onSectionFocusIn()"
  (focusout)="onSectionFocusOut()">

  <!-- WCAG 4.1.3: anuncia mudanças de estado ao leitor de tela -->
  <!-- Loading -->
  <div class="gallery-feedback" *ngIf="loading" aria-live="polite" aria-busy="true">
    <div class="gallery-spinner" aria-hidden="true"></div>
    <span>{{ 'gallery.loading' | translate:(lang$ | async) }}</span>
  </div>

  <!-- Erro -->
  <div class="gallery-feedback gallery-error" *ngIf="error && !loading" aria-live="polite">
    <span>{{ 'gallery.error' | translate:(lang$ | async) }}</span>
  </div>

  <!-- Sem posts com imagem -->
  <div class="gallery-feedback" *ngIf="!loading && !error && slides.length === 0" aria-live="polite">
    <span>{{ 'gallery.empty' | translate:(lang$ | async) }}</span>
  </div>

  <!-- Carrossel -->
  <ng-container *ngIf="!loading && !error && slides.length > 0">

    <!-- Carrossel -->
    <div class="gallery-swiper swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide" *ngFor="let slide of slides">
          <div class="slide-inner">
            <img [src]="slide.imageUrl" [alt]="slide.title" class="slide-image" />
            <div class="slide-overlay"></div>
            <div class="slide-content">
              <h2 class="slide-title">{{ slide.title }}</h2>
              <p class="slide-desc" *ngIf="slide.description">{{ slide.description }}</p>
              <span class="slide-date">{{ slide.date | date:"dd 'de' MMMM 'de' yyyy":'':'pt-BR' }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Navegação -->
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>

      <!-- Paginação -->
      <div class="swiper-pagination"></div>
    </div>

  </ng-container>

</section>
