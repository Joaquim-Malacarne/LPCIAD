<div class="language-selector">
  <button
    mat-button
    class="lang-btn"
    [matMenuTriggerFor]="langMenu"
    (menuOpened)="isOpen = true"
    (menuClosed)="isOpen = false"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="true"
    aria-label="Selecionar idioma"
    type="button"
  >
    <span class="flag-emoji" aria-hidden="true">{{ currentFlag }}</span>
    <span class="lang-code">{{ currentLang }}</span>

    <svg class="chevron" viewBox="0 0 24 24" [class.open]="isOpen" aria-hidden="true" focusable="false">
      <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" fill="currentColor"/>
    </svg>
  </button>

  <mat-menu #langMenu="matMenu" xPosition="after" yPosition="above" class="lang-menu">
    <button mat-menu-item *ngFor="let l of langs" (click)="select(l.code)">
      <span class="flag-emoji-menu" aria-hidden="true">{{ l.flag }}</span>
      <span class="menu-label">{{ l.label }}</span>
    </button>
  </mat-menu>
</div>
