<section class="post-list-section">

  <div class="section-header">
    <h2 class="section-title">{{ 'post_list.title' | translate:(lang$ | async) }}</h2>
    <div class="section-divider"></div>
  </div>

  <div class="state-container" *ngIf="loading">
    <div class="spinner"></div>
    <p class="state-text">{{ 'post_list.loading' | translate:(lang$ | async) }}</p>
  </div>

  <div class="state-container error" *ngIf="error && !loading">
    <p class="state-text">{{ error | translate:(lang$ | async) }}</p>
  </div>

  <div class="posts-grid" *ngIf="!loading && !error && posts.length > 0">
    <article class="post-card" *ngFor="let post of posts">

      <div class="post-image-wrapper">
        <img
          *ngIf="getImageUrl(post)"
          [src]="getImageUrl(post)!"
          [alt]="post.title"
          class="post-image"
        />
        <div class="post-image-placeholder" *ngIf="!getImageUrl(post)">
          <span class="placeholder-icon">📄</span>
        </div>
      </div>

      <div class="post-content">
        <div class="post-tags" *ngIf="post.tags && post.tags.length > 0">
          <span
            class="post-tag"
            *ngFor="let tag of post.tags"
            [style.background]="getTagBg(tag)"
            [style.color]="getTagColor(tag)"
          >{{ tag }}</span>
        </div>
        <p class="post-date">{{ formatDate(post.date, lang$ | async) }}</p>
        <h3 class="post-title" (click)="goToPost(post.id)">{{ post.title }}</h3>
        <p class="post-description" *ngIf="post.description">
          {{ post.description }}
        </p>
        <button class="btn-read-more" (click)="goToPost(post.id)">
          {{ 'post_list.read_more' | translate:(lang$ | async) }}
        </button>
      </div>

    </article>
  </div>

</section>
