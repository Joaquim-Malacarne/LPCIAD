<div class="login-container">
  <form class="login-form" (ngSubmit)="onSubmit()">
    <h1>{{ 'login.title' | translate:(lang$ | async) }}</h1>
    <p class="subtitle">{{ 'login.subtitle' | translate:(lang$ | async) }}</p>

    @if (error) {
      <p class="error">{{ error | translate:(lang$ | async) }}</p>
    }

    <div class="field">
      <label for="username">{{ 'login.username' | translate:(lang$ | async) }}</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        name="username"
        autocomplete="username"
        required
      />
    </div>

    <div class="field">
      <label for="password">{{ 'login.password' | translate:(lang$ | async) }}</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        autocomplete="current-password"
        required
      />
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? ('login.submitting' | translate:(lang$ | async)) : ('login.submit' | translate:(lang$ | async)) }}
    </button>
  </form>
</div>
