<div class="detail-page">

  <div class="detail-topbar">
    <button class="btn-back" (click)="goBack()">
      <span class="back-arrow">←</span> {{ 'post_detail.back' | translate:(lang$ | async) }}
    </button>
  </div>

  <div class="state-container" *ngIf="loading">
    <div class="spinner"></div>
    <p class="state-text">{{ 'post_detail.loading' | translate:(lang$ | async) }}</p>
  </div>

  <div class="state-container error" *ngIf="error && !loading">
    <p class="state-text">{{ error | translate:(lang$ | async) }}</p>
    <button class="btn-back" (click)="goBack()">← {{ 'post_detail.back' | translate:(lang$ | async) }}</button>
  </div>

  <div class="detail-body" *ngIf="post && !loading && !error">

    <div class="post-tags" *ngIf="post.tags && post.tags.length > 0">
      <span
        class="post-tag"
        *ngFor="let tag of post.tags"
        [style.background]="getTagBg(tag)"
        [style.color]="getTagColor(tag)"
      >{{ tag }}</span>
    </div>

    <div class="post-meta">
      <span class="meta-date">{{ formatDate(post.date) }}</span>
    </div>

    <div class="markdown-body" [innerHTML]="renderedContent"></div>

  </div>

  <!-- Outros Posts -->
  <div class="outros-posts-wrapper" *ngIf="!loading && !error && postId">
    <app-posts-feed [title]="'feed.other_posts'" [excludeId]="postId"></app-posts-feed>
  </div>

</div>
