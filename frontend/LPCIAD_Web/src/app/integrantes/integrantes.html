<div class="integrantes-page">

  <!-- WCAG 4.1.3: anuncia mudanças de estado ao leitor de tela -->
  <!-- Loading -->
  <div class="state-container" *ngIf="loading" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <!-- Erro -->
  <div class="state-container" *ngIf="error && !loading" aria-live="polite">
    <p class="state-text">{{ 'integrantes.error' | translate:(lang$ | async) }}</p>
  </div>

  <!-- Vazio -->
  <div class="state-container" *ngIf="empty && !loading && !error" aria-live="polite">
    <p class="state-text">{{ 'integrantes.empty' | translate:(lang$ | async) }}</p>
  </div>

  <!-- Conteúdo -->
  <div class="integrantes-body" *ngIf="!loading && !error && !empty">
    <div class="markdown-body" [innerHTML]="renderedContent"></div>
  </div>

</div>
