<div class="integrantes-page">

  <!-- Loading -->
  <div class="state-container" *ngIf="loading">
    <div class="spinner"></div>
  </div>

  <!-- Erro -->
  <div class="state-container" *ngIf="error && !loading">
    <p class="state-text">{{ 'integrantes.error' | translate:(lang$ | async) }}</p>
  </div>

  <!-- Vazio -->
  <div class="state-container" *ngIf="empty && !loading && !error">
    <p class="state-text">{{ 'integrantes.empty' | translate:(lang$ | async) }}</p>
  </div>

  <!-- Conteúdo -->
  <div class="integrantes-body" *ngIf="!loading && !error && !empty">
    <div class="markdown-body" [innerHTML]="renderedContent"></div>
  </div>

</div>
