<section class="feed-section">

  <!-- Cabeçalho + filtros -->
  <div class="feed-header">
    <div class="feed-title-row">
      <h2 class="feed-title">{{ title | translate:(lang$ | async) }}</h2>
      <div class="feed-divider"></div>
    </div>

    <div class="feed-filters">

      <!-- Busca por texto -->
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input
          type="text"
          class="search-input"
          [placeholder]="'feed.search_placeholder' | translate:(lang$ | async)"
          [(ngModel)]="searchText"
          (ngModelChange)="onSearch()"
        />
        <button class="search-clear" *ngIf="searchText" (click)="searchText = ''; onSearch()">✕</button>
      </div>

      <!-- Filtro por tags -->
      <div class="tag-filter-row">
        <button
          *ngFor="let tag of availableTags"
          class="tag-chip"
          [class.tag-chip--active]="isTagSelected(tag)"
          [style.background]="isTagSelected(tag) ? getTagBg(tag) : ''"
          [style.color]="isTagSelected(tag) ? getTagColor(tag) : ''"
          [style.border-color]="isTagSelected(tag) ? getTagColor(tag) : ''"
          (click)="toggleTag(tag)"
        >{{ tag }}</button>

        <button class="btn-clear-filters" *ngIf="hasActiveFilters" (click)="clearFilters()">
          {{ 'feed.clear_filters' | translate:(lang$ | async) }}
        </button>
      </div>

    </div>
  </div>

  <!-- WCAG 4.1.3: anuncia mudanças de estado ao leitor de tela -->
  <!-- Loading -->
  <div class="state-container" *ngIf="loading" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <p class="state-text">{{ 'feed.loading' | translate:(lang$ | async) }}</p>
  </div>

  <!-- Erro -->
  <div class="state-container state-error" *ngIf="error && !loading" aria-live="polite">
    <p class="state-text">{{ error | translate:(lang$ | async) }}</p>
  </div>

  <!-- Sem resultados (com filtro ativo) -->
  <div class="state-container" *ngIf="!loading && !error && filteredPosts.length === 0 && allPosts.length > 0" aria-live="polite">
    <p class="state-text">{{ 'feed.no_results' | translate:(lang$ | async) }}</p>
    <button class="btn-clear-filters" (click)="clearFilters()">{{ 'feed.clear_filters' | translate:(lang$ | async) }}</button>
  </div>

  <!-- Grid de posts -->
  <div class="posts-grid" *ngIf="!loading && !error && filteredPosts.length > 0">
    <!-- WCAG 2.1.1 + 2.4.7: card focável e navegável por Enter -->
    <article class="post-card" *ngFor="let post of filteredPosts">

      <div class="post-image-wrapper">
        <img
          *ngIf="getImageUrl(post)"
          [src]="getImageUrl(post)!"
          [alt]="post.title"
          class="post-image"
        />
        <div class="post-image-placeholder" *ngIf="!getImageUrl(post)">
          <span class="placeholder-icon">📄</span>
        </div>
      </div>

      <div class="post-content">
        <div class="post-tags" *ngIf="post.tags && post.tags.length > 0">
          <span
            class="post-tag"
            *ngFor="let tag of post.tags"
            [style.background]="getTagBg(tag)"
            [style.color]="getTagColor(tag)"
          >{{ tag }}</span>
        </div>
        <p class="post-date">{{ formatDate(post.date, lang$ | async) }}</p>
        <h3 class="post-title">{{ post.title }}</h3>
        <p class="post-description" *ngIf="post.description">{{ post.description }}</p>
        <!-- tabindex="-1": evita duplo-foco pois o card inteiro já é link -->
        <button class="btn-read-more" tabindex="-1" (click)="goToPost(post.id); $event.stopPropagation()">
          {{ 'feed.read_more' | translate:(lang$ | async) }}
        </button>
      </div>

      <!-- stretched link: cobre o card inteiro; foco visível via :focus-visible -->
      <a class="card-link"
         [routerLink]="['/post', post.id]"
         [attr.aria-label]="post.title"></a>

    </article>
  </div>

</section>
